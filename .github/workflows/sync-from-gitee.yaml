name: Sync from Gitee
on:
  schedule:
    - cron: '0 */4 * * *'     # 每 4 小时一次
  workflow_dispatch:         # 也可以手动触发
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0       # 获取所有历史
      - name: Pull from Gitee
        run: |
          git remote add gitee https://用户名:${{ secrets.GITEE_TOKEN }}@gitee.com/用户名/仓库.git
          git fetch gitee
          git merge gitee/main --allow-unrelated-histories -m "Sync from Gitee"
      - name: Push to GitHub
        run: git push origin main
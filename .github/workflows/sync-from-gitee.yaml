name: Sync from Gitee

on:
  schedule:
    - cron: '0 */24 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取GitHub仓库（添加写权限）
      - name: Checkout GitHub repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. 配置Git用户信息（必须）
      - name: Setup Git
        run: |
          git config user.name "Gitee Sync Bot"
          git config user.email "gitee-sync@users.noreply.github.com"

      # 3. 配置Gitee凭据
      - name: Setup Gitee credentials
        run: |
          echo "machine gitee.com" > ~/.netrc
          echo "  login ${{ secrets.GITEE_USER }}" >> ~/.netrc
          echo "  password ${{ secrets.GITEE_TOKEN }}" >> ~/.netrc
          chmod 600 ~/.netrc

      # 4. 添加Gitee远程
      - name: Fetch from Gitee
        run: |
          git remote add gitee https://gitee.com/${{ secrets.GITEE_USER }}/PRF-YOLOv8.git  # 添加.git后缀
          git fetch gitee

      # 5. 合并分支（确认分支名）
      - name: Merge from Gitee
        run: |
          git checkout main
          # 如果Gitee分支是master：
          git merge gitee/master --allow-unrelated-histories -m "Sync from Gitee $(date +'%Y-%m-%d')"
          
          # 如果Gitee也是main分支：
          # git merge gitee/main --allow-unrelated-histories -m "Sync from Gitee $(date +'%Y-%m-%d')"

      # 6. 推回GitHub
      - name: Push to GitHub
        run: git push origin main